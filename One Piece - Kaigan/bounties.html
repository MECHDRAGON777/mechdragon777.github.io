<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaigan Project - Global Bounties</title>
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap&subset=latin,latin-ext" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@700&family=Scheherazade+New:wght@700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bounty.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <style>
        body {
            background-color: #121212;
            color: #f5f5dc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
            max-width: 1200px;
            border-bottom: 2px solid #3e2723;
            padding-bottom: 20px;
        }

        h1 {
            font-family: 'Schezwarlde', serif;
            font-size: 3.5rem;
            margin: 0;
            color: #c5a059;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .gallery-controls {
            margin-bottom: 50px;
            display: flex;
            gap: 15px;
        }

        .btn-action {
            background: #3e2723;
            color: #f5f5dc;
            border: 1px solid #c5a059;
            padding: 12px 24px;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: #c5a059;
            color: #1a1a1a;
        }

        #bounty-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 386px);
            gap: 50px;
            justify-content: center;
            width: 100%;
            max-width: 1400px;
            padding-bottom: 100px;
        }

        /* This ensures each poster container is treated as a single block for potential export */
        .poster-item-container {
            width: 386px;
            height: 577px;
            position: relative;
        }
    </style>
</head>
<body>

    <header>
        <h1>Global Bounty Rankings</h1>
        <p style="font-style: italic; color: #888;">Classified records of the Kaigan Project</p>
    </header>

    <div class="gallery-controls">
        <button class="btn-action" onclick="generateGallery()">Sort by Threat Level</button>
    </div>

    <div id="bounty-gallery-grid">
        <!-- Posters will be generated and injected here -->
    </div>

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Project Files -->
    <!-- Note: Ensure your kaigan-engine.js contains the generateGallery() and renderSinglePoster() functions we built -->
    <script src="js/config.js"></script>
    <script src="js/database.js"></script>
    <script src="js/bounty.js"></script>
    <script src="js/sidebar.js"></script>

</body>
</html>
