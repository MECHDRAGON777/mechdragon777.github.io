<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kaigan Database</title>
    <link rel="stylesheet" href="/css/sidebar.css">
	<style>
        body { background-color: #1a1a1a; color: white; font-family: 'Montserrat', sans-serif; margin: 0; display: flex; overflow-x: hidden; }
        #guide-sidebar { width: 350px; min-width: 350px; height: 100vh; background: #111; border-right: 1px solid #2C2C2C; position: fixed; top: 0; left: 0; overflow-y: auto; z-index: 999; }
        #guide-content { margin-left: 350px; padding: 40px; flex-grow: 1; transition: margin-left 0.4s ease; box-sizing: border-box; display: block; }
        h1 { margin-top: 0; font-family: 'Special Elite', monospace; }
        #tab-navigation { margin-bottom: 20px; display: flex; flex-wrap: wrap; width: 100%; border-bottom: 2px solid #7289da; }
        .tab-btn { background: #23272a; color: #99aab5; border: 1px solid #444; border-bottom: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 8px 8px 0 0; margin-right: 5px; transition: 0.2s; font-family: 'Special Elite', monospace; font-size: 0.85em; }
        .tab-btn:hover { background: #32353b; color: white; }
        .tab-btn.active { background: #7289da; color: white; border-color: #7289da; }
        #searchInput { width: 100%; padding: 12px; background: #23272a; color: white; border: 1px solid #444; border-radius: 5px; margin-bottom: 20px; box-sizing: border-box; font-family: 'Montserrat', sans-serif; display: block; }
        #data-container { width: 100%; display: block; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; background: #2c2f33; }
        th { background-color: #7289da; color: white; padding: 12px; text-align: left; font-family: 'Special Elite', monospace; }
        td { padding: 10px; border: 1px solid #444; font-size: 14px; }
        .loading { padding: 20px; color: #7289da; font-family: 'Special Elite', monospace; }
    </style>
</head>
<body>
    <main id="guide-content">
        <h1>Kaigan Database</h1>

        <div id="tab-navigation">
            <button class="tab-btn active" onclick="switchTab('OC Database', this)">OC Database</button>
            <button class="tab-btn" onclick="switchTab('Eaten Fruits', this)">Devil Fruit</button>
            <button class="tab-btn" onclick="switchTab('Meito', this)">Famous Blades</button>
            <button class="tab-btn" onclick="switchTab('Meijo', this)">Famous Guns</button>
            <button class="tab-btn" onclick="switchTab('Inventions', this)">Technology</button>
            <button class="tab-btn" onclick="switchTab('Tames', this)">Tames</button>
            <button class="tab-btn" onclick="switchTab('Haki Database', this)">Haki Database</button>
            <button class="tab-btn" onclick="switchTab('Trait Caps', this)">Caps</button>
            <button class="tab-btn" onclick="switchTab('Income Tiers', this)">Income Tiers</button>
            <button class="tab-btn" onclick="switchTab('Territories', this)">Territory List</button>
        </div>

        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search current tab...">
        
        <div id="data-container">Establishing connection...</div>
    </main> 
	<script src="/js/config.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>
        // --- CONFIGURATION ---
        const API_KEY = atob("QUl6YVN5Q2RBN1RJWVRMcmY4MU94bkxKM3VnRzU0THk1QVJBVWxv");
        const SHEET_ID = '1ETXbWLkutsUdMCWkE1Yt6fbqMD1CGVe8Cr3TeyyGmao';
        let currentTab = 'OC Database';

	async function switchTab(tabName, btnElement) {
            if (currentTab === tabName) return; 
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            document.getElementById('data-container').innerHTML = `<div class="loading">Processing ${tabName}...</div>`;
            await loadData();
        }

        async function loadData() {
            const RANGE = `'${currentTab}'!A1:P`; 
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?includeGridData=true&ranges=${encodeURIComponent(RANGE)}&key=${API_KEY}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                const sheet = data.sheets.find(s => s.properties.title === currentTab);
                if (!sheet || !sheet.data[0].rowData) throw new Error("Tab data missing.");

                const rowData = sheet.data[0].rowData;
                
                // --- HEADER DETECTION ---
                let headerRowIndex = 0;
                let maxDiscoveries = 0;
                
                for (let r = 0; r <= 1; r++) {
                    if (!rowData[r] || !rowData[r].values) continue;
                    let textCount = rowData[r].values.filter(c => c?.formattedValue?.trim()).length;
                    if (textCount > maxDiscoveries) {
                        maxDiscoveries = textCount;
                        headerRowIndex = r;
                    }
                }

                let headerCells = rowData[headerRowIndex].values || [];
                let validIndices = [];
                let headerHtml = '<table><thead><tr>';
                
                for (let index = 0; index < headerCells.length; index++) {
                    let val = headerCells[index]?.formattedValue?.trim() || "";
                    headerHtml += `<th>${val !== "" ? val : "-"}</th>`;
                    validIndices.push(index);
                }
                headerHtml += '</tr></thead><tbody>';

                // --- DATA ROWS WITH IN-ROW MERGE ---
                let bodyHtml = '';
                for (let r = headerRowIndex + 1; r < rowData.length; r++) {
                    const rowCells = rowData[r].values;
                    if (!rowCells) continue;

                    const hasRealData = validIndices.some(index => rowCells[index]?.formattedValue?.trim());
                    if (!hasRealData) continue;

                    bodyHtml += '<tr>';
                    
                    for (let i = 0; i < validIndices.length; i++) {
                        const colIndex = validIndices[i];
                        const cell = rowCells[colIndex];
                        let rawText = cell?.formattedValue || cell?.effectiveValue?.stringValue || '';
                        
                        // --- THE MERGE TRIGGER ---
                        let isRacial = rawText.toUpperCase().includes("RACIAL");
                        let cellAttributes = "";

                        if (isRacial) {
                            cellAttributes = `colspan="2" style="text-align: center; font-weight: bold; background-color: #5865F2 !important; color: white !important;"`;
                            i++; 
                        }

                        // Color Logic & Legend Fix
                        const colorObj = cell?.effectiveFormat?.backgroundColor;
                        let hasColor = false;
                        let colorStyles = "";

                        if (!isRacial && colorObj && (colorObj.red || colorObj.green || colorObj.blue)) {
                            const rV = Math.round((colorObj.red || 0) * 255);
                            const gV = Math.round((colorObj.green || 0) * 255);
                            const bV = Math.round((colorObj.blue || 0) * 255);
                            if (!(rV === 255 && gV === 255 && bV === 255)) {
                                const brightness = ((rV * 299) + (gV * 587) + (bV * 114)) / 1000;
                                colorStyles = `background-color: rgb(${rV}, ${gV}, ${bV}); color: ${brightness >= 128 ? 'black' : 'white'};`;
                                cellAttributes = `style="${colorStyles}"`;
                                hasColor = true;
                            }
                        }

                        // Target the status columns dynamically to preserve the background cells cleanly
                        if ((colIndex === 0 || colIndex === 1) && rawText === '' && hasColor) {
                            rawText = '&nbsp;'; 
                        } else if (rawText === '') {
                            rawText = '-';
                        }

                        // Link Logic
                        let displayContent = rawText;
                        let finalLink = cell?.hyperlink || null;
                        const discordRegex = /(https?:\/\/)?(www\.)?(discord\.(gg|io|me|li)|discordapp\.com\/invite|discord\.com\/channels)\/[^\s]+/;
                        if (rawText.includes("discord")) {
                            let match = rawText.match(discordRegex);
                            if (match) {
                                finalLink = match[0];
                                displayContent = rawText.replace(discordRegex, '').trim() || "Link";
                            }
                        }
                        if (finalLink) {
                            displayContent = `<a href="${finalLink}" target="_blank" style="color: inherit; text-decoration: underline;">${displayContent}</a>`;
                        }

                        bodyHtml += `<td ${cellAttributes}>${displayContent}</td>`;
                    }
                    bodyHtml += '</tr>';
                }
                
                document.getElementById('data-container').innerHTML = headerHtml + bodyHtml + '</tbody></table>';

            } catch (error) {
                document.getElementById('data-container').innerHTML = `<b style="color:red">Error:</b> ${error.message}`;
            }
        }

        function filterTable() {
            const input = document.getElementById("searchInput").value.toUpperCase();
            const rows = document.querySelector("table tbody")?.rows;
            if (!rows) return;
            for (let i = 0; i < rows.length; i++) {
                rows[i].style.display = rows[i].textContent.toUpperCase().includes(input) ? "" : "none";
            }
        }

        loadData();
    </script>
</body>
</html>
